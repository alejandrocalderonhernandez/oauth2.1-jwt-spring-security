<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orión · Iniciar sesión</title>
    <style>
        :root {
          --n0: #150d2e; --n1: #21163f; --n2: #2e2054; --n3: #6d5aa6;
          --n4: #d8cff5; --n5: #e9e4fb; --n6: #f6f3ff;
          --cyan: #67e8f9; --accent: #ffd166;
          --accent-dim: rgba(255, 209, 102, .13); --accent-line: rgba(255, 209, 102, .45);
          --red: #ff6b9d; --green: #7ee0a8;
          --bg: #0d0820; --card: rgba(30, 20, 60, .72); --line: rgba(196, 181, 253, .16);
          --mono: ui-monospace, 'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace;
          --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          min-height: 100vh; display: grid; place-items: center; padding: 24px;
          background:
            radial-gradient(ellipse 70% 55% at 85% -5%, rgba(139, 92, 246, .30), transparent 60%),
            radial-gradient(ellipse 60% 50% at 0% 105%, rgba(236, 72, 153, .16), transparent 60%),
            radial-gradient(ellipse 45% 40% at 50% 50%, rgba(79, 70, 229, .10), transparent 70%),
            var(--bg);
          color: var(--n4); font: 15px/1.6 var(--sans);
        }
        .card {
          width: 100%; max-width: 400px; padding: 34px 30px 28px;
          background: var(--card); border: 1px solid var(--line); border-radius: 18px;
          backdrop-filter: blur(10px); box-shadow: 0 24px 60px rgba(8, 4, 24, .55);
        }
        .brand { display: flex; align-items: center; gap: 13px; margin-bottom: 26px; }
        .brand-ic {
          width: 48px; height: 48px; border-radius: 13px; display: grid; place-items: center;
          background: var(--accent-dim); border: 1px solid var(--accent-line); color: var(--accent);
        }
        .brand-tx { display: flex; flex-direction: column; line-height: 1.15; }
        .brand-tx b { font: 700 18px var(--mono); letter-spacing: .22em; color: var(--n6); }
        .brand-tx small { font-size: 11px; color: var(--cyan); letter-spacing: .08em; text-transform: uppercase; }
        h1 { font-size: 20px; font-weight: 650; color: var(--n6); margin-bottom: 4px; }
        .sub { font-size: 14px; color: var(--n4); margin-bottom: 22px; }
        .msg {
          display: flex; align-items: center; gap: 9px; padding: 10px 13px; margin-bottom: 18px;
          border-radius: 10px; font-size: 13.5px; border: 1px solid;
        }
        .msg.err { color: #ff8fb5; background: rgba(255, 107, 157, .10); border-color: rgba(255, 107, 157, .45); }
        .msg.ok { color: var(--green); background: rgba(126, 224, 168, .10); border-color: rgba(126, 224, 168, .45); }
        label { display: block; font: 600 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--lav, #b8a6ff); margin-bottom: 6px; }
        .field { margin-bottom: 16px; }
        input {
          width: 100%; font: inherit; font-size: 15px; color: var(--n6); background: var(--n0);
          border: 1px solid var(--n3); border-radius: 10px; padding: 11px 13px; transition: .15s;
        }
        input::placeholder { color: rgba(216, 207, 245, .35); }
        input:focus { outline: 2px solid var(--accent-line); border-color: var(--accent); }
        button {
          width: 100%; margin-top: 6px; cursor: pointer; font: 700 15px var(--sans); color: #1b1230;
          background: var(--accent); border: 1px solid var(--accent); border-radius: 10px; padding: 12px 16px;
          transition: .15s;
        }
        button:hover { filter: brightness(1.07); }
        button:focus-visible { outline: 2px solid var(--n6); outline-offset: 2px; }
        .foot { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); text-align: center;
          font: 11px var(--mono); letter-spacing: .08em; color: var(--n3); }
        @media (max-width: 440px) { .card { padding: 28px 22px 24px; } }
    </style>
</head>
<body>
<main class="card">
    <div class="brand">
      <span class="brand-ic">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="2.6"/>
          <ellipse cx="12" cy="12" rx="10" ry="4.2" transform="rotate(-28 12 12)"/>
          <circle cx="19.4" cy="7.4" r="1.2" fill="currentColor" stroke="none"/>
        </svg>
      </span>
        <span class="brand-tx"><b>ORIÓN</b><small>Control de misión</small></span>
    </div>

    <h1>Iniciar sesión</h1>
    <p class="sub">Entra con tu cuenta para continuar.</p>

    <div class="msg err" role="alert" th:if="${param.error}">
        <span>Usuario o contraseña incorrectos.</span>
    </div>
    <div class="msg ok" role="status" th:if="${param.logout}">
        <span>Sesión cerrada correctamente.</span>
    </div>

    <form th:action="@{/login}" method="post">
        <div class="field">
            <label for="username">Usuario</label>
            <input id="username" name="username" type="text" placeholder="admin" autocomplete="username" required autofocus>
        </div>
        <div class="field">
            <label for="password">Contraseña</label>
            <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>
        <button type="submit">Entrar</button>
    </form>

    <p class="foot">OAUTH 2.1 · AUTHORIZATION CODE + PKCE</p>
</main>
</body>
</html>
